name: Upload new reviews

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: TaylorOD/mr-game-and-sweat
          path: data/site
          sparse-checkout: _posts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python -m scripts.upload_reviews --days 7
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
