services:
  - type: web
    name: ask-game-and-sweat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process on purpose, the rate limits live in memory
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.10
